<text x="145" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a" font-family="sans-serif">Postgres</text>
<text x="145" y="320" text-anchor="middle" font-size="12" fill="#5f5e5a" font-family="sans-serif">Sessions, tasks, pings, results</text>
</g>

<g>
