<svg width="680" height="616" viewBox="0 0 680 616" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>System architecture</title>
<desc>Business creates and assigns tasks, and participants start sessions, ping locations, end visits, and submit reports, all through the Next.js app, which stores data in Postgres and calls FastAPI for confidence scoring. Postgres and FastAPI results stream live via SSE to the business dashboard, which shows tasks grouped with live proximity and verification status.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="616" fill="#ffffff"/>

<line x1="210" y1="96" x2="300" y2="160" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="475" y1="96" x2="390" y2="160" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M280,216 L280,250 L145,250 L145,280" fill="none" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M400,216 L400,262 L495,262 L495,280" fill="none" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="150" y="240" font-size="12" fill="#5f5e5a" font-family="sans-serif">session, pings, tasks</text>
<text x="405" y="252" font-size="12" fill="#5f5e5a" font-family="sans-serif">report submitted</text>

<line x1="380" y1="308" x2="240" y2="308" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="245" y="298" font-size="12" fill="#5f5e5a" font-family="sans-serif">writes score</text>

<path d="M145,336 L145,370 L340,370 L340,400" fill="none" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="456" x2="340" y2="520" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="110" y="40" width="200" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="210" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c447c" font-family="sans-serif">Business</text>
<text x="210" y="80" text-anchor="middle" font-size="12" fill="#185fa5" font-family="sans-serif">Creates tasks, assigns</text>
</g>

<g>
<rect x="370" y="40" width="210" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="475" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c447c" font-family="sans-serif">Participant</text>
<text x="475" y="80" text-anchor="middle" font-size="12" fill="#185fa5" font-family="sans-serif">Start, ping, end, report</text>
</g>

<g>
<rect x="170" y="160" width="340" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="340" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041" font-family="sans-serif">Next.js app</text>
<text x="340" y="200" text-anchor="middle" font-size="12" fill="#0f6e56" font-family="sans-serif">API routes, live proximity calc</text>
</g>

<g>
