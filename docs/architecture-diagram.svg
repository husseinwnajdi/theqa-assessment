<text x="495" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c3489" font-family="sans-serif">FastAPI verification</text>
<text x="495" y="320" text-anchor="middle" font-size="12" fill="#534ab7" font-family="sans-serif">Confidence scoring</text>
</g>

<g>
<rect x="240" y="400" width="200" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
